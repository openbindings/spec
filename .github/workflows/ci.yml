name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for the snapshot-immutability diff against the PR base

      - name: Verify Design identity assets
        run: node scripts/verify-design-assets.mjs

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate examples against schema
        run: |
          for f in examples/*.obi.json; do
            echo "Validating $f..."
            ajv validate -s openbindings.schema.json -d "$f" --spec=draft2020 -c ajv-formats
          done

      - name: Check canonical field ordering
        run: |
          node scripts/check-canonical-order.mjs examples/*.obi.json

      - name: Validate operation-graph schema is valid JSON
        run: python3 -m json.tool binding-specs/operation-graph/openbindings.operation-graph.schema.json > /dev/null

      - name: Verify operation-graph examples and conformance subcorpus
        run: node scripts/verify-operation-graph.mjs

      - name: Run operation-graph reference runner (executes execution fixtures)
        run: |
          cd conformance/operation-graph/runners/js
          npm install --no-audit --no-fund
          node run.mjs

      - name: Run operation-graph reference runner (adversarial interleavings)
        run: |
          cd conformance/operation-graph/runners/js
          node run.mjs --adversarial --trials=512

      - name: Verify binding-specs conformance subcorpus
        run: node scripts/verify-binding-specs.mjs

      - name: Verify binding-spec publication records
        run: node scripts/verify-binding-spec-publications.mjs

      - name: Validate transform conformance corpus
        run: |
          for f in conformance/transforms/agree/*.json conformance/transforms/known-divergence/*.json; do
            ajv validate -s conformance/transforms/transforms.schema.json -d "$f" --spec=draft2020
          done
          node scripts/verify-transform-corpus.mjs

      - name: Validate binding-specification errata manifest
        run: ajv validate -s binding-specs/errata.schema.json -d binding-specs/errata.json --spec=draft2020

      - name: Verify binding-specification publications
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ]; then
            node scripts/verify-binding-spec-publications.mjs --base "$base"
          else
            node scripts/verify-binding-spec-publications.mjs
          fi

      - name: Exercise binding-specification publication lifecycle
        run: node scripts/test-binding-spec-publication-lifecycle.mjs

      - name: Verify conformance corpus consistency
        run: node scripts/verify-corpus.mjs

      - name: Check conformance manifest is up-to-date
        run: |
          node scripts/generate-conformance-manifest.mjs
          git diff --exit-code conformance/manifest.json

      - name: Verify release snapshot layout
        run: node scripts/verify-release-snapshot.mjs

      - name: Enforce immutability of released snapshots
        # Released snapshots under versions/X.Y.Z/ are immutable
        # (RELEASING.md Principles; CONTRIBUTING.md): a PR may only ADD
        # files there (a new release's snapshot). versions/README.md is the
        # one mutable file — its index gains an entry per release.
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          violations=$(git diff --no-renames --name-status "$base"...HEAD -- versions/ | awk -F'\t' '$1 != "A" && $2 != "versions/README.md" { print }')
          if [ -n "$violations" ]; then
            echo "::error::Released snapshots are immutable; these files under versions/ were changed:"
            echo "$violations"
            echo "Corrections to released text ship as errata in the next release (RELEASING.md)."
            exit 1
          fi
          echo "no released snapshot files changed"

      - name: Enforce immutability of binding-specification publications
        # Publication bundles and individual errata are append-only. The
        # manifests may gain entries; the verifier above proves every existing
        # entry remains byte-equivalent to the PR or pre-push base.
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ]; then
            echo "no historical base is available; current publication integrity was verified"
            exit 0
          fi
          bundle_violations=$(git diff --no-renames --name-status "$base"...HEAD -- binding-specs/releases/ | awk -F'\t' '$1 != "A" { print }')
          errata_violations=$(git diff --no-renames --name-status "$base"...HEAD -- binding-specs/errata/ | awk -F'\t' '$1 != "A" && $2 != "binding-specs/errata/README.md" { print }')
          if [ -n "$bundle_violations" ] || [ -n "$errata_violations" ]; then
            echo "::error::Published binding-specification bundles and errata are immutable:"
            echo "$bundle_violations"
            echo "$errata_violations"
            echo "Publish a new binding-specification revision or append a new erratum."
            exit 1
          fi
          echo "no published binding-specification artifact changed"

      - name: Check local markdown links
        run: |
          rc=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oP '\[(?:[^\]]*)\]\(\K[^)#][^)]*?\.(?:md|json|yaml|yml)' "$file" 2>/dev/null | while IFS= read -r target; do
              case "$target" in http://*|https://*) continue;; esac
              target_file="${target%%#*}"
              resolved="$dir/$target_file"
              if [ ! -f "$resolved" ]; then
                echo "BROKEN LINK: $file -> $target (resolved: $resolved)"
                exit 1
              fi
            done || rc=1
          done < <(find . -name '*.md' -not -path '*/node_modules/*' -not -path './versions/*' -not -path './history/*' -not -path './temp_ref/*')
          exit $rc

  reference-go:
    name: Go binding conformance (${{ matrix.family }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: OpenAPI
            module: formats/openapi
            client: openapi-client
          - family: AsyncAPI
            module: formats/asyncapi
            client: asyncapi-client
          - family: GraphQL
            module: formats/graphql
          - family: gRPC
            module: formats/grpc
          - family: Connect
            module: formats/connect
          - family: MCP
            module: formats/mcp
          - family: Usage
            module: formats/usage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openbindings-go
          ref: release/0.2
          path: openbindings-go
      # A family whose module depends on a standalone client needs that client
      # checked out and `replace`d: the client repos are unreleased, so the
      # version in go.mod resolves to no tag and the module fetch fails.
      - uses: actions/checkout@v7
        if: matrix.client != ''
        with:
          repository: openbindings/${{ matrix.client }}
          ref: main
          path: ${{ matrix.client }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openbindings-go/${{ matrix.module }}/go.mod
          cache: false
      - name: Resolve the reference SDK core from its checkout
        working-directory: openbindings-go
        run: |
          client="${{ matrix.client }}"
          if [ -n "$client" ]; then
            go work init . ${{ matrix.module }} "../$client/go"
          else
            go work init . ${{ matrix.module }}
          fi
          ver=$(awk '/github.com\/openbindings\/openbindings-go v/ {print $NF}' ${{ matrix.module }}/go.mod)
          go work edit -replace "github.com/openbindings/openbindings-go@${ver}=."
          if [ -n "$client" ]; then
            # Pin the replace to whatever the module actually requires, so a
            # version bump in go.mod cannot silently fall back to the network.
            cver=$(awk -v c="github.com/openbindings/$client/go" '$1==c {print $2}' ${{ matrix.module }}/go.mod)
            go work edit -replace "github.com/openbindings/$client/go@${cver}=../$client/go"
          fi
      - name: Execute shared processor and synthesis scenarios
        working-directory: openbindings-go/${{ matrix.module }}
        run: go test -run 'TestProcessorScenarios|TestSynthesisScenarios' ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/conformance
          OB_CORPUS_REQUIRED: "1"

  reference-typescript:
    name: TypeScript binding conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openbindings-ts
          ref: release/0.2
          path: openbindings-ts
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openapi-client
          ref: main
          path: openapi-client
      - uses: actions/checkout@v7
        with:
          repository: openbindings/asyncapi-client
          ref: main
          path: asyncapi-client
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: openbindings-ts/pnpm-lock.yaml
      # openbindings-ts links both standalone clients by relative path
      # (pnpm-lock.yaml: link:../../../<client>/typescript), so each has to be
      # installed and built before the workspace build can resolve its dist.
      - name: Build standalone artifact clients
        run: |
          pnpm --dir openapi-client install --frozen-lockfile
          pnpm --dir openapi-client build
          pnpm --dir asyncapi-client install --frozen-lockfile
          pnpm --dir asyncapi-client build
      - run: pnpm install --frozen-lockfile
        working-directory: openbindings-ts
      - run: pnpm run build
        working-directory: openbindings-ts
      - name: Execute shared processor and synthesis scenarios
        working-directory: openbindings-ts
        run: pnpm exec vitest run packages/*/src/processor-scenarios.test.ts packages/*/src/synthesis-scenarios.test.ts
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/conformance
          OB_CORPUS_REQUIRED: "1"

  authority:
    name: Authority pins and transcription
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetches every pinned authority, verifies size + sha256 against
      # AUTHORITY-PINS.json, and populates .authority-cache/ for the
      # transcription verifier below. Network-dependent by design, so it
      # lives in its own job and never blocks the deterministic Validate
      # job's signal.
      - name: Verify authority pins (fetch + sha256)
        run: node scripts/verify-authority-pins.mjs

      - name: Verify OpenAPI 3.0 Schema Object transcription
        run: node scripts/verify-openapi-30-schema-object-transcription.mjs
