name: Historical compatibility replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reference-go:
    name: Legacy Go binding corpus (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: AsyncAPI
            module: formats/asyncapi
            client: asyncapi-client
            client-ref: 7326ce4e18c12e1dcb36c3587fbe0f7fe52ec749
          - family: GraphQL
            module: formats/graphql
          - family: gRPC
            module: formats/grpc
          - family: Connect
            module: formats/connect
          - family: MCP
            module: formats/mcp
          - family: Usage
            module: formats/usage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Go SDK's release line now carries only the core; its binding-format
      # modules are being rebuilt outward from it. Until each returns, the
      # families run on the preserved line, where every format module builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/openbindings-go
          ref: aceb788965625e7e5d7cbeec8cf436e91416b5d5
          path: openbindings-go
      # A family whose module depends on a standalone client needs that client
      # checked out and `replace`d: the client repos are unreleased, so the
      # version in go.mod resolves to no tag and the module fetch fails. The
      # client is pinned to the commit the preserved line was verified with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.client != ''
        with:
          repository: openbindings/${{ matrix.client }}
          ref: ${{ matrix.client-ref }}
          path: ${{ matrix.client }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: openbindings-go/${{ matrix.module }}/go.mod
          cache: false
      - name: Resolve the reference SDK core from its checkout
        working-directory: openbindings-go
        run: |
          client="${{ matrix.client }}"
          if [ -n "$client" ]; then
            go work init . ${{ matrix.module }} "../$client/go"
          else
            go work init . ${{ matrix.module }}
          fi
          ver=$(awk '/github.com\/openbindings\/openbindings-go v/ {print $NF}' ${{ matrix.module }}/go.mod)
          go work edit -replace "github.com/openbindings/openbindings-go@${ver}=."
          if [ -n "$client" ]; then
            # Pin the replace to whatever the module actually requires, so a
            # version bump in go.mod cannot silently fall back to the network.
            cver=$(awk -v c="github.com/openbindings/$client/go" '$1==c {print $2}' ${{ matrix.module }}/go.mod)
            go work edit -replace "github.com/openbindings/$client/go@${cver}=../$client/go"
          fi
      - name: Execute shared processor and synthesis scenarios
        working-directory: openbindings-go/${{ matrix.module }}
        run: go test -run 'TestProcessorScenarios|TestSynthesisScenarios' ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/conformance
          OB_CORPUS_REQUIRED: "1"

  # Runs the reference Go runner (conformance/runners/go) against this corpus,
  # historical, with the Go core pinned to one exact commit, the one that adopts
  # this text. The runner's results are compared with the corpus's complete
  # case set and with conformance/runners/go/expected-failures.json, keyed by
  # case, pin, status, and signature: an unexpected failure, shortfall, or
  # omission, an unknown status, an expected failure that passes, a missing or
  # unexplained case, and a reconciliation problem all fail. A later Go commit
  # reaches this job only by changing the pin here, in a spec change.
  reference-go-core:
    name: Go core conformance runner (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GO_CORE_PIN: "c5c6076fcf6bcf30a428c70c00bb4f3cbf6447df"
    steps:
      # The spec at path: spec and the SDK at path: openbindings-go, so the
      # runner's go.mod replace directives (../../../../openbindings-go)
      # resolve to the pinned checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: spec
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/openbindings-go
          ref: ${{ env.GO_CORE_PIN }}
          path: openbindings-go
      - name: Check the pin names the checkout
        run: test "$(git -C openbindings-go rev-parse HEAD)" = "$GO_CORE_PIN"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: openbindings-go/go.mod
          cache: false
      - name: Exercise the runner's controls
        working-directory: spec/conformance/runners/go
        run: go test ./...
      - name: Run the reference runner against the corpus
        working-directory: spec/conformance/runners/go
        run: |
          go build -o "$RUNNER_TEMP/runner" .
          # Exit 1 means a case failed, fell short, or did not reconcile: the
          # comparison below judges each against the expected results. Exit 2
          # is a usage or IO error, and fails here.
          rc=0
          "$RUNNER_TEMP/runner" -corpus ../.. -json -pin "$GO_CORE_PIN" > "$RUNNER_TEMP/runner-results.json" || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
      - name: Compare with the corpus and the expected failures and omissions
        run: node spec/scripts/check-runner-results.mjs --results "$RUNNER_TEMP/runner-results.json" --expected spec/conformance/runners/go/expected-failures.json --corpus spec/conformance

  reference-typescript:
    name: TypeScript binding conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/openbindings-ts
          ref: 173a5b4a63a4574b9576338add880b215749a66f
          path: openbindings-ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/openapi-client
          ref: 0ed7cfca730aa66dcbf04239bca4fc4992f6b119
          path: openapi-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/asyncapi-client
          ref: 7326ce4e18c12e1dcb36c3587fbe0f7fe52ec749
          path: asyncapi-client
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: openbindings-ts/pnpm-lock.yaml
      # Match the SDK's prerequisite order: neutral JSON packages, standalone
      # clients, then the full SDK. The clients consume the JSON packages,
      # while the SDK links to the clients.
      - name: Build neutral JSON prerequisites
        working-directory: openbindings-ts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @openbindings/json --filter @openbindings/json-schema build
      - name: Build standalone artifact clients
        run: |
          pnpm --dir openapi-client install --frozen-lockfile
          pnpm --dir openapi-client build
          pnpm --dir asyncapi-client install --frozen-lockfile
          pnpm --dir asyncapi-client build
      - run: pnpm install --frozen-lockfile
        working-directory: openbindings-ts
      - run: pnpm run build
        working-directory: openbindings-ts
      - name: Execute shared processor and synthesis scenarios
        working-directory: openbindings-ts
        run: pnpm exec vitest run packages/*/src/processor-scenarios.test.ts packages/*/src/synthesis-scenarios.test.ts
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/conformance
          OB_CORPUS_REQUIRED: "1"

  authority:
    name: Authority pins and transcription
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fetches every pinned authority, verifies size + sha256 against
      # AUTHORITY-PINS.json, and populates .authority-cache/ for the
      # transcription verifier below. Network-dependent by design, so it
      # lives in its own job and never blocks the deterministic Validate
      # job's signal.
      - name: Verify authority pins (fetch + sha256)
        run: node scripts/verify-authority-pins.mjs

      - name: Verify OpenAPI 3.0 Schema Object transcription
        run: node scripts/verify-openapi-30-schema-object-transcription.mjs

  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: conformance/operation-graph/runners/js
      - name: Run operation-graph reference runner (adversarial interleavings)
        run: |
          cd conformance/operation-graph/runners/js
          node run.mjs --adversarial --trials=512
