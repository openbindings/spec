name: Historical compatibility replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reference-go:
    name: Go binding conformance (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: OpenAPI
            module: formats/openapi
          - family: AsyncAPI
            module: formats/asyncapi
          - family: GraphQL
            module: formats/graphql
          - family: gRPC
            module: formats/grpc
          - family: Connect
            module: formats/connect
          - family: MCP
            module: formats/mcp
          - family: Usage
            module: formats/usage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/openbindings-go
          ref: aceb788965625e7e5d7cbeec8cf436e91416b5d5
          path: openbindings-go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: openbindings-go/${{ matrix.module }}/go.mod
          cache: false
      - name: Resolve the reference SDK core from its checkout
        working-directory: openbindings-go
        run: |
          go work init . ${{ matrix.module }}
          ver=$(awk '/github.com\/openbindings\/openbindings-go v/ {print $NF}' ${{ matrix.module }}/go.mod)
          go work edit -replace "github.com/openbindings/openbindings-go@${ver}=."
      - name: Execute shared processor and synthesis scenarios
        working-directory: openbindings-go/${{ matrix.module }}
        run: go test -run 'TestProcessorScenarios|TestSynthesisScenarios' ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/conformance
          OB_CORPUS_REQUIRED: "1"

  reference-typescript:
    name: TypeScript binding conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/openbindings-ts
          ref: c53ef707ca1170c705775532fd30a8d7e87e3e5e
          path: openbindings-ts
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: openbindings-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: openbindings-ts
      - run: pnpm run build
        working-directory: openbindings-ts
      - name: Execute shared processor and synthesis scenarios
        working-directory: openbindings-ts
        run: pnpm exec vitest run packages/*/src/processor-scenarios.test.ts packages/*/src/synthesis-scenarios.test.ts
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/conformance
          OB_CORPUS_REQUIRED: "1"

  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: conformance/operation-graph/runners/js
      - name: Run operation-graph reference runner (adversarial interleavings)
        run: |
          cd conformance/operation-graph/runners/js
          node run.mjs --adversarial --trials=512
