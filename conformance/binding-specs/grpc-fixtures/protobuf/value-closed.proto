syntax = "proto2";
package closedproto2;

import "google/protobuf/any.proto";

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_READY = 1;
}

message ClosedEnums {
  optional State singular = 1;
  repeated State expanded = 2 [packed = false];
  repeated State packed = 3 [packed = true];
  map<string, State> mapped = 4;
  oneof choice {
    State chosen = 5;
    int32 alternate = 6;
  }
}

message TextNode {
  optional string text = 1;
  repeated string texts = 2;
  optional TextNode nested = 3;
  map<string, TextNode> children = 4;
  optional google.protobuf.Any any = 5;
  map<string, string> labels = 6;
  oneof choice {
    string chosen = 7;
    int32 alternate = 8;
  }
}

// Mirrors the pinned protoc oracle's descriptor-sensitive binary edge domain.
enum ClosedNonZero {
  FIRST = 7;
  SECOND = 9;
}

enum ClosedMapValue {
  MAP_ZERO = 0;
  MAP_FIRST = 7;
  MAP_SECOND = 9;
}

message MergeChild {
  optional int32 left = 1;
  optional int32 right = 2;
}

message ClosedProbe {
  optional ClosedNonZero singular = 1;
  repeated ClosedNonZero expanded = 2 [packed = false];
  repeated ClosedNonZero packed = 3 [packed = true];
  oneof selection {
    ClosedNonZero selected = 4;
    int32 alternate = 5;
  }
  map<sint32, ClosedMapValue> sint_map = 6;
  map<fixed32, ClosedMapValue> fixed_map = 7;
  map<bool, ClosedMapValue> bool_map = 8;
  map<string, MergeChild> message_map = 9;
  map<int32, string> int_map = 10;
  map<uint64, string> uint_map = 11;
  map<sfixed64, string> sfixed_map = 12;
  optional string proto2_text = 13;
}
